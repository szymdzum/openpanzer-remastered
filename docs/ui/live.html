<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panzer Marshal UI: live components</title>
<!-- A card's real components (src/view/gallery.tsx) in Paper and Blackout, with the cards' CSS:
     tokens.css, the components' (src/view/library.css) and the screens' (components/bundle.css).
     Needs the dev server, which compiles the .tsx: npm run dev, then /docs/ui/live.html?card=Button.
     index.html shows it under each card. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Libre+Franklin:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="../../src/view/library.css">
<link rel="stylesheet" href="components/bundle.css">
<style>body { margin: 0; }</style>
</head>
<body>
<div id="live"></div>
<script type="module">
	import { mountGallery } from "/src/view/gallery.tsx";
	const card = new URLSearchParams(location.search).get("card") || "Button";
	const root = document.getElementById("live");
	mountGallery(root, card);
	//to index.html, which shows this page under the card only when it has components
	const tell = () => parent.postMessage({ card, built: !!root.querySelector("section.pm"), height: document.documentElement.scrollHeight }, location.origin);
	new ResizeObserver(tell).observe(root);
</script>
</body>
</html>
