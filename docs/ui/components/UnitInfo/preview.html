<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Libre+Franklin:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap">

<div class="pm pm-stage" style="width:900px;height:230px">
  
  <div class="pm-map" style="background-image:url(assets/map-ciechanow.jpg);transform:translate(-300px,-500px) scale(1)" aria-hidden="true">
    <svg class="hexes" width="1632" height="1040"></svg>
    
  </div>
  
  <section id="unit-info" class="pm-panel pm-info" aria-label="Selected unit" style="bottom:24px">
    <div>
      <div class="name"><svg class="mark sm" aria-hidden="true"><use href="#pm-flag-de"/></svg>Pz IIA</div>
      <div class="cls">1st Panzer · Tank · Core</div>
      <span class="pm-stars" aria-label="Experience 2 of 5"><svg class="i sm" aria-hidden="true"><use href="#pm-star"/></svg><svg class="i sm" aria-hidden="true"><use href="#pm-star"/></svg><span class="off"><svg class="i sm" aria-hidden="true"><use href="#pm-star"/></svg></span><span class="off"><svg class="i sm" aria-hidden="true"><use href="#pm-star"/></svg></span><span class="off"><svg class="i sm" aria-hidden="true"><use href="#pm-star"/></svg></span></span>
      <div class="leader"><svg class="i sm" aria-hidden="true"><use href="#pm-leader"/></svg>No leader yet</div>
    </div>
    <div>
      <div class="pm-meter ok"><svg class="i sm" aria-hidden="true"><use href="#pm-strength"/></svg><span>Strength</span><span class="v">10/10</span><span class="track"><b style="width:100%"></b></span></div>
      <div class="pm-meter low"><svg class="i sm" aria-hidden="true"><use href="#pm-fuel"/></svg><span>Fuel<span class="st">Low</span></span><span class="v">18/50</span><span class="track"><b style="width:36%"></b></span></div>
      <div class="pm-meter critical"><svg class="i sm" aria-hidden="true"><use href="#pm-ammo"/></svg><span>Ammo<span class="st">Critical</span></span><span class="v">1/8</span><span class="track"><b style="width:12%"></b></span></div>
      <div class="pm-meter"><svg class="i sm" aria-hidden="true"><use href="#pm-entrench"/></svg><span>Entrench</span><span class="v">0</span><span class="track"><b style="width:0"></b></span></div></div>
    <div><div class="pm-stats "><div><span class="k">Soft atk</span><span class="n">5</span></div><div><span class="k">Hard atk</span><span class="n">3</span></div><div><span class="k">Air atk</span><span class="n">0</span></div><div><span class="k">Naval atk</span><span class="n">1</span></div><div><span class="k">Gnd def</span><span class="n">7</span></div><div><span class="k">Air def</span><span class="n">8</span></div><div><span class="k">Close def</span><span class="n">2</span></div><div><span class="k">Initiative</span><span class="n">7</span></div><div><span class="k">Range</span><span class="n">1</span></div><div><span class="k">Spotting</span><span class="n">2</span></div><div><span class="k">Move</span><span class="n">5</span></div><div><span class="k">Exp</span><span class="n">120</span></div></div></div>
  </section>
  <div class="pm-panel" style="left:24px;top:16px;padding:8px 12px;font-size:12px;line-height:16px;max-width:110px"><div class="pm-label">Leader</div><div class="pm-prestige" style="font-weight:700"><svg class="i sm" aria-hidden="true"><use href="#pm-leader"/></svg>Tank Killer</div><div class="pm-muted">+1 hard attack</div></div>
</div>
<script>window.PM && PM.mount();</script>
