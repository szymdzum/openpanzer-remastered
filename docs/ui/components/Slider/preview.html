<!-- @dsCard group="Controls" height=170 width=900 subtitle="Interface width, interface scale and map scale" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Libre+Franklin:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap">

<div class="pm" style="padding:24px;background:var(--panel);display:grid;gap:4px;max-width:620px">
  <div class="pm-setting"><span class="t">Interface scale</span><input class="pm-range" type="range" min="0.5" max="3" step="0.1" value="1" style="--val:20%" aria-label="Interface scale"><span class="val">1.0×</span></div>
  <div class="pm-setting"><span class="t">Game map scale</span><input class="pm-range" type="range" min="1" max="3" step="0.1" value="1.4" style="--val:20%" aria-label="Game map scale"><span class="val">1.4×</span></div>
</div>
<script>window.PM && PM.mount();</script>
