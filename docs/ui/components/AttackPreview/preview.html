<style>
.ladder{display:grid;grid-template-columns:repeat(2,520px);gap:22px 24px;justify-content:center}
.ladder figure{margin:0}
.ladder figcaption{margin-top:8px;font:400 12px/17px var(--font-ui);color:var(--ink-muted)}
.ladder figcaption b{display:block;color:var(--ink);font:700 14px/18px var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.ladder .scene{position:relative;width:520px;height:400px;overflow:hidden;background:url(assets/map-clean.jpg) -470px -40px no-repeat;image-rendering:pixelated;border:1px solid var(--line-strong)}
.ladder .ov{position:absolute;inset:0}
.ladder .spr{position:absolute;width:80px;height:50px;background-image:url(assets/units-sheet3.png);image-rendering:pixelated}
.ladder .mk{position:absolute;transform:translateX(-50%);height:11px;display:flex}
.ladder .mk b{position:relative;padding:0 3px;height:11px;font:700 9px/11px Arial,sans-serif;color:#fff;background:#4f6b80;border:.5px solid rgba(0,0,0,.75)}
.ladder .mk.en b{background:#9c3b22;clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 50%,calc(100% - 3px) 100%,3px 100%,0 50%);padding:0 5px;border:0}
.ladder .ent{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.ladder .ent i{width:5px;height:3px;border-radius:1.5px;background:#c8b27a;border:.5px solid #2b2519}
.ladder .at{position:absolute;z-index:3}
.ladder .cardwrap{position:absolute;z-index:4}
.ladder .card{width:244px;padding:9px 10px 9px 12px;gap:6px}
.ladder .card .vs,.ladder .card .why>div{font-size:11px;line-height:14px}
.ladder .card .where,.ladder .card .commit{font-size:10px;line-height:13px}
.ladder .card .head{font-size:13px}
.ladder .card .verdict{font-size:11px}
.break{width:360px;padding:9px 12px;font-size:11px;line-height:14px}
.break .head{display:flex;gap:6px;align-items:center;font:700 13px/16px var(--font-ui);margin-bottom:4px}
.break table{width:100%;border-collapse:collapse;margin-top:2px}
.break td{padding:1px 4px 1px 0}
.break tr.h td{font:600 9px/12px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--line)}
.break tr.t td{font-weight:700;border-top:1px solid var(--line)}
.break td.n{font:700 11px/14px var(--font-mono);text-align:right;width:28px}
.break td.n.up{color:var(--critical)} .break td.n.dn{color:var(--ok)}
.break .calc{margin:3px 0 2px;font:400 10px/13px var(--font-mono);color:var(--ink)}
.hist{display:grid;grid-template-columns:72px 1fr;align-items:end;gap:8px;margin:2px 0 6px}
.hist .hl{font:600 10px/12px var(--font-ui);color:var(--ink-muted)}
.hist .hb{display:flex;gap:2px;align-items:flex-end;height:36px}
.hist .hb div{position:relative;width:18px;background:var(--line);margin-bottom:12px}
.hist .hb div.in{background:var(--ink-muted)}
.hist .hb span{position:absolute;bottom:-12px;left:0;right:0;text-align:center;font:700 9px/11px var(--font-mono);color:var(--ink-muted)}
.break .foot{font-size:10px;color:var(--ink-muted)}
.variants{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:26px;padding:16px;background:#6d6a45;border:1px solid var(--line-strong)}
.variants>div{display:grid;justify-items:start;align-content:start;gap:6px}
.variants img{image-rendering:pixelated;width:54px;height:54px}
.variants span{font:400 11px/14px var(--font-ui);color:#f4eedd}
.variants b{display:block;font-weight:700}
</style>
