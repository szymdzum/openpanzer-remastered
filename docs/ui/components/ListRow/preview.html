<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Libre+Franklin:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap">

<div class="pm" style="padding:24px;background:var(--panel)">
  <div class="pm-list" role="listbox" style="max-width:520px">
    <div class="group">Axis</div>
    <button class="pm-row is-on" role="option" aria-selected="true"><svg class="mark " aria-hidden="true"><use href="#pm-flag-de"/></svg><span><span class="t">Fall Weiss 8 Armee</span><br><span class="m">1939 · 4 scenarios</span></span><span class="r pm-data pm-prestige">2,000</span></button>
    <button class="pm-row is-hot" role="option"><svg class="mark " aria-hidden="true"><use href="#pm-flag-it"/></svg><span><span class="t">Mussolini's Afrika Korps</span><br><span class="m">1940–1945 · 31 scenarios</span></span><span class="r pm-data pm-prestige">2,000</span></button>
    <div class="group">Allied</div>
    <button class="pm-row" role="option"><svg class="mark " aria-hidden="true"><use href="#pm-flag-su"/></svg><span><span class="t">The Great Patriotic War</span><br><span class="m">1942–1945 · 20 scenarios</span></span><span class="r pm-data pm-prestige">4,000</span></button>
  </div>
</div>
<script>window.PM && PM.mount();</script>
