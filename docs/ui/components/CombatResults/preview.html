<!-- @dsCard group="Screens · In game" height=650 width=700 subtitle="After the combat: losses over each hex, one stamp for what happened, and the same line in the status bar" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Libre+Franklin:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
.pm-results{display:grid;grid-template-columns:repeat(2,300px);gap:18px 20px;justify-content:center}
.pm-results figure{margin:0;display:grid;gap:0}
.pm-results figcaption{font:600 12px/16px var(--font-ui);color:var(--ink-muted);margin-top:6px}
.pm-results .scene{position:relative;width:300px;height:170px;overflow:hidden;background:url(assets/map-clean.jpg) -500px -160px;image-rendering:pixelated}
.pm-results .ov{position:absolute;inset:0}
.pm-results .spr{position:absolute;width:80px;height:50px;background-image:url(assets/units-sheet3.png);image-rendering:pixelated}
.pm-results .mk{position:absolute;transform:translateX(-50%);height:11px;display:flex}
.pm-results .mk b{position:relative;padding:0 3px;height:11px;font:700 9px/11px Arial,sans-serif;color:#fff;background:#4f6b80;border:.5px solid rgba(0,0,0,.75)}
.pm-results .mk.en b{background:#9c3b22;clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 50%,calc(100% - 3px) 100%,3px 100%,0 50%);padding:0 5px;border:0}
.pm-results .ent{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.pm-results .ent i{width:5px;height:3px;border-radius:1.5px;background:#c8b27a;border:.5px solid #2b2519}
.pm-results .msg{font:400 12px/16px var(--font-mono);color:var(--ink-muted);background:var(--panel);border:1px solid var(--line-strong);border-top:0;padding:5px 8px}
.pm-results .msg b{color:var(--ink)}
.pm-events{display:flex;flex-wrap:wrap;gap:14px 10px;justify-content:center;padding:26px 10px 6px}
.pm-events .pm-event{position:static;transform:rotate(-3deg)}
</style>
<div class="pm" style="padding:20px;background:var(--panel-sunken)">

</div>
