# typos (npm run typos, CI): misspellings in code, comments and docs.
# Names the game and the harness use as they are: changing them changes the saved game or the data.
[default.extend-words]
briliant = "briliant" # outcomeNames.briliant, a key of the saved campaign dossier
nd = "nd"             # local names (row/col deltas) in ui.ts and uibuilder.ts
iy = "iy"             # render.ts coordinates
ba = "ba"             # harness/diff-traces.js: baseline arrays
PN = "PN"
ligh = "ligh"         # it22ligh.xml, a scenario file the tests load

[files]
extend-exclude = ["game/", "reference/", "public/", "dist/", "dist-*/", "coverage/", "reports/", "harness/out/", "test/contracts/**/*.gz", "test/mapsizes.json", "package-lock.json", "*.svg", "docs/design/"]
