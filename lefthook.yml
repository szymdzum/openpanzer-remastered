# Git hooks (npm install sets them up through the prepare script): fast checks on what is being
# committed, so a broken commit is caught before CI. `git commit --no-verify` skips them.
pre-commit:
  parallel: true
  jobs:
    - name: types
      glob: "*.{ts,tsx,mts}"
      run: npm run -s check
    - name: lint
      glob: ["src/*.ts", "src/*.tsx", "test/*.ts", "test/*.tsx", "test/contracts/*.js"]
      run: npx oxlint --type-aware --deny-warnings {staged_files}
    - name: typos
      # --force-exclude: the files _typos.toml excludes stay excluded when they are staged (fixtures)
      run: command -v typos >/dev/null && typos --force-exclude {staged_files} || true
