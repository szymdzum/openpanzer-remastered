# Types, the linter, fallow (what a change adds:
# unused code, import cycles, duplicates, complexity), typos and the tests with the per-file coverage floors
# (vite.config.mts), on every pull request and on main. The tests need the game's data
# (equipment, scenarios), not its images and sounds: the checkout leaves Git LFS out.
# npm run verify needs the reference (openpanzer-src) and Chrome: it stays a local step. The job e2e plays one
# short game through the new UI in headless Chrome (test/e2e/game.ts), with the images and sounds from Git LFS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The contracts were recorded in this time zone (test/setup.ts)
env:
  TZ: Europe/Warsaw

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fallow audit compares with the base branch
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run stylelint
      - name: "fallow dead-code: the whole tree has no unused code and no import cycles"
        run: npx fallow dead-code
      - name: "fallow audit: what this change adds (unused code, import cycles, duplicates, complexity)"
        run: npx fallow audit --base origin/${{ github.base_ref || 'main' }}
      - name: "fallow health: a report, doesn't fail"
        run: npx fallow health --format markdown >> "$GITHUB_STEP_SUMMARY" || true
      - uses: crate-ci/typos@v1
      - run: npm run test:coverage

  # The new UI's end-to-end test: a campaign game from the start menu to its second scenario, through the page's
  # element ids and keys, in the runner's Google Chrome (test/e2e/game.ts)
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verify-setup
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure
          path: harness/out/e2e-failure.png
          retention-days: 7
