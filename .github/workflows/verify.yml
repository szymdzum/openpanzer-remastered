# npm run verify on pull requests: the whole game in headless Chrome (16 AI vs AI replays, 24 UI
# scripts, state, DOM and canvas after every step) compared with the base branch
# (BASELINE_REF, harness/lib/reference.sh), not with the original game: main differs from the
# original on purpose (the unit markers). A refactor must come out identical; a deliberate change
# shows what it changed in the run's summary and artifacts.
#
# verify is a required check on main. It runs on every pull request so a docs-only change isn't
# left waiting for it: without changes to the game or the harness it passes at once. A
# difference fails it, unless the pull request carries the label behavior-change, which the
# owner adds after reading the differences of a deliberate change: then it passes and the
# summary still lists every difference.
#
# The run the label accepts records the fingerprint of its differences in a comment on the pull
# request (.github/scripts/verify-fingerprint.sh: which games and steps differ and how, not the
# values, which depend on the base). After a new push the label stays when verify finds the same
# fingerprint (a rebase that changed nothing the label accepted); with other differences verify
# takes the label off and fails, and they are read again.
name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# The contracts and the scenario dates were recorded in this time zone (test/setup.ts)
env:
  TZ: Europe/Warsaw

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base branch is checked out next to this one
      - name: Does the change touch the game or the harness?
        id: changes
        run: |
          base=origin/${{ github.base_ref || 'main' }}
          if [ "${{ github.event_name }}" != "pull_request" ] || git diff --name-only "$base"...HEAD \
            | grep -qE '^(src|harness|reference|game|public)/|^index\.html$|^vite\.config\.mts$|^package(-lock)?\.json$|^\.github/workflows/verify\.yml$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No change to the game or the harness: nothing to verify." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The game's images and sounds are in Git LFS (about 300 MB): cached, so the LFS bandwidth
      # quota is spent once per change of the assets, not on every run
      - name: List the LFS objects
        if: steps.changes.outputs.code == 'true'
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v6
        if: steps.changes.outputs.code == 'true'
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - run: git lfs pull
        if: steps.changes.outputs.code == 'true'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.code == 'true'
      - run: npm install --global browser-debugger-cli@0.21.0
        if: steps.changes.outputs.code == 'true'
      # The base branch's traces, kept between runs (the file names carry the base commit)
      - uses: actions/cache@v6
        if: steps.changes.outputs.code == 'true'
        with:
          path: harness/out/baseline
          key: verify-baseline-${{ github.event.pull_request.base.sha || github.sha }}-${{ hashFiles('harness/**') }}
          restore-keys: verify-baseline-
      - name: Verify against the base branch
        id: verify
        if: steps.changes.outputs.code == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          BASELINE_REF=origin/${{ github.base_ref || 'main' }} JOBS=3 npm run verify 2>&1 | tee "$RUNNER_TEMP/verify.log"
      - name: Summary
        if: always() && steps.changes.outputs.code == 'true'
        run: |
          {
            echo "### verify against ${{ github.base_ref || 'main' }}"
            echo '```'
            grep -E 'items differ|identical|scripts identical|DIFF|TIMED OUT' "$RUNNER_TEMP/verify.log" | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.verify.outcome == 'failure'
        with:
          name: verify-traces
          path: |
            harness/out/replay-*/
            harness/out/ui-*/
            ${{ runner.temp }}/verify.log
          retention-days: 7
      # A difference fails the check, unless the owner accepted it with the label behavior-change. A
      # run the label accepts records its fingerprint; after a new push the label holds only for
      # the same fingerprint. The label is read now, not from the event (it may have changed since)
      - name: Differences accepted?
        if: steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          NEW_PUSH: ${{ github.event.action == 'synchronize' }}
        run: |
          fingerprint=$(.github/scripts/verify-fingerprint.sh "$RUNNER_TEMP/verify.log")
          echo "Fingerprint of the differences: \`$fingerprint\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$PR" ]; then
            echo "verify found differences: read the summary." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          labelled=$(gh pr view "$PR" --repo "$REPO" --json labels -q '[.labels[].name] | index("behavior-change") != null')
          accepted=$(gh api "repos/$REPO/issues/$PR/comments" --paginate -q '.[].body' \
            | grep -oE 'verify-accepted: [0-9a-f]+' | tail -1 | cut -d' ' -f2 || true)
          if [ "$labelled" != "true" ]; then
            echo "verify found differences: read the summary; a deliberate change needs the label behavior-change." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$NEW_PUSH" = "true" ]; then
            if [ "$fingerprint" = "$accepted" ]; then
              echo "The same differences as the ones accepted with behavior-change (fingerprint $accepted): the label stays." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh pr edit "$PR" --repo "$REPO" --remove-label behavior-change
            echo "The differences changed since behavior-change accepted them (fingerprint ${accepted:-none}, now $fingerprint): the label is off, read them again." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Differences accepted with the label behavior-change." >> "$GITHUB_STEP_SUMMARY"
          if [ "$fingerprint" != "$accepted" ]; then
            {
              echo "<!-- verify-accepted: $fingerprint -->"
              echo "verify: the label \`behavior-change\` accepted these differences ([run]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID)). A new push keeps the label only if verify finds the same ones."
              echo '```'
              .github/scripts/verify-fingerprint.sh "$RUNNER_TEMP/verify.log" --lines | head -60
              echo '```'
            } > "$RUNNER_TEMP/accepted.md"
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/accepted.md"
          fi
