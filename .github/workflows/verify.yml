# npm run verify on pull requests: the game in headless Chrome (16 AI vs AI replays, the state before
# every AI action and at every turn's end, a save and its load) compared with the base branch
# (BASELINE_REF, harness/lib/reference.sh), not with the original game. A refactor must come out
# identical; a deliberate change shows what it changed in the run's summary and artifacts. The UI has
# its own end-to-end test (ci.yml e2e) since it replaced the old one (#351).
#
# verify is a required check on main. It runs on every pull request so a docs-only change isn't
# left waiting for it: without changes to the game or the harness it passes at once. A
# difference fails it, unless the pull request carries the label behavior-change, which the
# owner adds after reading the differences of a deliberate change: then it passes and the
# summary still lists every difference.
#
# The run the label accepts records the fingerprint of its differences in a comment on the pull
# request (.github/scripts/verify-fingerprint.sh: which games and steps differ and how, not the
# values, which depend on the base). After a new push the label stays when verify finds the same
# fingerprint (a rebase that changed nothing the label accepted); with other differences verify
# takes the label off and fails, and they are read again.
#
# The jobs: play the game only on a push (the shard replay: the AI games), then judge (the required
# check verify, verify-judge.sh). Adding or taking off the label plays nothing: the judge reads the play
# of the same commit. After every push to main, warm plays main's own traces into the cache, so a pull
# request on it plays only its side.
name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

# The contracts and the scenario dates were recorded in this time zone (test/setup.ts)
env:
  TZ: Europe/Warsaw

jobs:
  # Whether the pull request touches the game or the harness, and whether this event plays (a push) or
  # only judges (a label)
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      play: ${{ steps.changes.outputs.play }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
            | grep -qE '^(src|harness|reference|game|public)/|^index\.html$|^vite\.config\.mts$|^package(-lock)?\.json$|^\.github/(workflows/verify\.yml|scripts/verify-|actions/verify-)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          case "${{ github.event.action }}" in
            opened|synchronize|reopened) echo "play=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "play=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # One shard of the game played on the pull request and on its base, its log kept for the judge. A
  # newer push cancels it
  play:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.play == 'true'
    name: play (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: verify-play-${{ github.event.pull_request.number }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: [replay]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base is checked out next to this one
      # The checkout is GitHub's merge commit, and its first parent the base it was built on. GitHub
      # doesn't build it again while the pull request conflicts with its base: comparing with the base
      # branch's head would count its new commits, reversed, as the pull request's differences (#263)
      - name: The base
        id: base
        run: |
          base=$(git rev-parse HEAD^1)
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          if [ "$base" != "$(git rev-parse "origin/${{ github.base_ref }}")" ]; then
            echo "The pull request's merge commit is built on $base, not on the base branch's head: it conflicts with the base or was built before the base moved on. Compared with $base." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: ./.github/actions/verify-setup
      # The base's traces, played by warm after its push to main (the file names carry the base commit
      # and the harness's version)
      - uses: actions/cache@v6
        with:
          path: harness/out/baseline
          key: verify-baseline-${{ steps.base.outputs.sha }}-${{ hashFiles('harness/**') }}-${{ matrix.shard }}
      - name: Play
        run: BASELINE_REF=${{ steps.base.outputs.sha }} JOBS=3 .github/scripts/verify-shard.sh "$RUNNER_TEMP/verify-${{ matrix.shard }}.log" ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/verify-${{ matrix.shard }}.log
          retention-days: 30
      - name: Any difference?
        id: differs
        if: always()
        run: |
          if grep -qE "^DIFF " "$RUNNER_TEMP/verify-${{ matrix.shard }}.log"; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: always() && steps.differs.outputs.yes == 'true'
        with:
          name: verify-traces-${{ matrix.shard }}
          path: harness/out/replay-*/
          retention-days: 7

  # The required check: the differences of the play of this commit, accepted or not. On a label added
  # or taken off it reads the play of the push before, waiting for it if it still runs
  verify:
    needs: [changes, play]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Nothing to verify
        if: needs.changes.outputs.code != 'true'
        run: |
          echo "No change to the game or the harness: nothing to verify." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
        with:
          sparse-checkout: .github/scripts
      - name: Judge
        if: needs.changes.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          PLAYED: ${{ needs.changes.outputs.play }}
          NEW_PUSH: ${{ github.event.action == 'synchronize' }}
        run: |
          PLAY_RUN=$(.github/scripts/verify-play-logs.sh "$RUNNER_TEMP/logs")
          export PLAY_RUN
          echo "The play: $GITHUB_SERVER_URL/$REPO/actions/runs/$PLAY_RUN" | tee -a "$GITHUB_STEP_SUMMARY"
          ls "$RUNNER_TEMP"/logs/*/
          cat "$RUNNER_TEMP"/logs/*/*.log > "$RUNNER_TEMP/verify.log"
          .github/scripts/verify-judge.sh "$RUNNER_TEMP/verify.log"

  # After a push to main, main's own traces, which the pull requests on it compare with, into the cache
  warm:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: warm (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [replay]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify-setup
      - uses: actions/cache@v6
        with:
          path: harness/out/baseline
          key: verify-baseline-${{ github.sha }}-${{ hashFiles('harness/**') }}-${{ matrix.shard }}
      - name: Play the base's traces
        run: BASELINE_ONLY=1 BASELINE_REF=${{ github.sha }} JOBS=3 .github/scripts/verify-shard.sh "$RUNNER_TEMP/warm.log" ${{ matrix.shard }}
